name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gemini-tradingagents + test runner (no keys)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Installer dry-run (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -DryRun
      - name: Tests
        run: python -m pytest -q tests
      - name: Pipeline dry-run (no keys, no model calls)
        run: python -m gemini_tradingagents --dry-run AAPL
